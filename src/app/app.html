<!-- Global Floating Top Pop-up Notification (Persists across route navigation until auto-dismiss or manual Close) -->
<ng-container *ngIf="notificationService.notification$ | async as notification">
  <div id="global-top-notification"
       style="position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 999999; display: flex; align-items: center; justify-content: space-between; min-width: 320px; max-width: 90vw; padding: 10px 24px; border-radius: 8px; font-weight: 600; font-size: 0.9rem; box-shadow: 0 4px 16px rgba(0,0,0,0.2); transition: all 0.3s ease; color: #ffffff;"
       [style.background-color]="notification.type === 'success' ? '#42ab49' : '#e53935'">
    <span>{{ notification.message }}</span>
    <button type="button" (click)="clearNotification()" style="background: none; border: none; color: #ffffff; font-weight: 700; cursor: pointer; font-size: 0.9rem; padding: 0 4px; margin-left: 24px; text-decoration: none;">Close</button>
  </div>
</ng-container>

<router-outlet />
