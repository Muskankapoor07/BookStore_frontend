<div class="page-container">
  <!-- Top Navigation Header Bar -->
  <header class="navbar">
    <div class="navbar-brand" routerLink="/login">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.2 20.4 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.35-.75-2-.95zM11 18.5c-1.35-.85-3.8-1.5-5.5-1.5-1.2 0-2.4.15-3.5.5V7.5c1.1-.35 2.3-.5 3.5-.5 1.7 0 4.15.65 5.5 1.5v10z"/>
      </svg>
      <span class="brand-text">Bookstore</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content">
    <h1 class="page-title">Forgot Your Password?</h1>

    <div class="card">
      <div class="card-body">
        <p class="description-text">
          Enter your email address and we'll send you a link to reset your password.
        </p>

        <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="forgot-form" id="forgot-password-form">
          <div class="form-group" [class.error]="forgotForm.get('email')?.invalid && (forgotForm.get('email')?.touched || submitted)">
            <label for="email-input">Email Id</label>
            <input
              type="email"
              id="email-input"
              formControlName="email"
              placeholder=""
            />
            <span class="error-msg" *ngIf="forgotForm.get('email')?.invalid && (forgotForm.get('email')?.touched || submitted)">
              Enter a valid email address
            </span>
          </div>

          <button type="submit" class="submit-btn" id="reset-password-btn">
            Reset Password
          </button>
        </form>
      </div>

      <!-- Bottom Card Action Footer -->
      <div class="card-footer">
        <a [routerLink]="['/login']" [queryParams]="{ tab: 'signup' }" class="create-account-link" id="create-account-btn">
          CREATE ACCOUNT
        </a>
      </div>
    </div>
  </main>
</div>
