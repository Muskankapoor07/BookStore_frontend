<header class="navbar">
  <div class="navbar-content">
    <!-- Left: Logo & Brand -->
    <div class="navbar-brand" routerLink="/home">
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
        <path d="M21 5c-1.11-.35-2.33-.5-3.5-.5-1.95 0-4.05.4-5.5 1.5-1.45-1.1-3.55-1.5-5.5-1.5S2.45 4.9 1 6v14.65c0 .25.25.5.5.5.1 0 .15-.05.25-.05C3.2 20.4 5.05 20 6.5 20c1.95 0 4.05.4 5.5 1.5 1.35-.85 3.8-1.5 5.5-1.5 1.65 0 3.35.3 4.75 1.05.1.05.15.05.25.05.25 0 .5-.25.5-.5V6c-.6-.45-1.35-.75-2-.95zM11 18.5c-1.35-.85-3.8-1.5-5.5-1.5-1.2 0-2.4.15-3.5.5V7.5c1.1-.35 2.3-.5 3.5-.5 1.7 0 4.15.65 5.5 1.5v10z"/>
      </svg>
      <span class="brand-text">Bookstore</span>
    </div>

    <!-- Center: Search Input Bar -->
    <div class="search-box">
      <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#888888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/>
        <line x1="21" y1="21" x2="16.65" y2="16.65"/>
      </svg>
      <input
        type="text"
        placeholder="Search ..."
        [value]="searchQuery"
        (input)="onSearchInput($event)"
        class="search-input"
        id="navbar-search-input"
      />
    </div>

    <!-- Right: User Profile & Cart -->
    <div class="nav-actions">
      <!-- Profile Button -->
      <div class="nav-item profile-item" (click)="toggleProfileMenu($event)">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
        <span class="nav-label">{{ currentUser ? currentUser.firstName : 'Profile' }}</span>

        <!-- Profile Dropdown Popup -->
        <div class="profile-dropdown" *ngIf="isProfileMenuOpen" (click)="$event.stopPropagation()">
          <div class="dropdown-arrow"></div>

          <!-- Guest View (Not Logged In) -->
          <div class="welcome-box" *ngIf="!currentUser">
            <h3 class="welcome-title">Welcome</h3>
            <p class="welcome-sub">To access account and manage orders</p>
            <a routerLink="/login" class="btn-login-signup" (click)="isProfileMenuOpen = false">
              LOGIN/SIGNUP
            </a>
          </div>

          <!-- Logged In View -->
          <div class="welcome-box" *ngIf="currentUser">
            <h3 class="welcome-title">Hello {{ currentUser.firstName }}</h3>
            <p class="welcome-sub">{{ currentUser.email }}</p>
          </div>

          <hr class="dropdown-divider" />

          <!-- Menu Options -->
          <div class="dropdown-links">
            <a routerLink="/cart" class="dropdown-link-item" (click)="isProfileMenuOpen = false">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-svg">
                <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"/>
                <line x1="3" y1="6" x2="21" y2="6"/>
                <path d="M16 10a4 4 0 0 1-8 0"/>
              </svg>
              <span>My Orders</span>
            </a>
            <a routerLink="/wishlist" class="dropdown-link-item" (click)="isProfileMenuOpen = false">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="menu-svg">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
              </svg>
              <span>Wishlist</span>
            </a>
          </div>

          <div style="margin-top: 0.6rem;" *ngIf="currentUser">
            <button type="button" class="logout-btn" (click)="logout()">
              <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                <polyline points="16 17 21 12 16 7"/>
                <line x1="21" y1="12" x2="9" y2="12"/>
              </svg>
              Logout
            </button>
          </div>
        </div>
      </div>

      <!-- Cart Button -->
      <div class="nav-item cart-item" routerLink="/cart">
        <div class="cart-icon-wrapper">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="21" r="1"/>
            <circle cx="20" cy="21" r="1"/>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/>
          </svg>
          <span class="cart-badge" *ngIf="cartCount > 0">{{ cartCount }}</span>
        </div>
        <span class="nav-label">Cart</span>
      </div>
    </div>
  </div>
</header>
